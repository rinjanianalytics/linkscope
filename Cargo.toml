[workspace]
resolver = "2"
members = ["crates/rate", "crates/config", "crates/mockagent", "crates/web", "crates/linkscope"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.88"
repository = "https://github.com/rinjanianalytics/linkscope"
description = "LinkScope: link utilization monitoring, a memory-safe drop-in reimplementation of MRTG"
authors = ["Rinjani Analytics"]
homepage = "https://rinjanianalytics.com"

[profile.release]
lto = "thin"
codegen-units = 4
