[package]
name = "linkscope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "linkscope"
path = "src/lib.rs"

[[bin]]
name = "linkscope"
path = "src/main.rs"

[dependencies]
linkscope-rate = { path = "../rate" }
linkscope-config = { path = "../config" }
linkscope-web = { path = "../web" }
# SNMP (replaced snmp2 in 2026-10: it changed v3 session state before authenticating a reply).
# Pinned: a pre-1.0 library on the security path is updated deliberately, after reading the change.
async-snmp = { version = "=0.18.1", default-features = false, features = ["crypto-rustcrypto"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
bigdecimal = "0.4"
nix = { version = "0.31", features = ["user", "fs", "process", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shell-words = "1"
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
hmac = "0.12"
sha2 = "0.10"


[dev-dependencies]
tempfile = "3"
