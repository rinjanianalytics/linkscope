[package]
name = "linkscope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "linkscope"
path = "src/lib.rs"

[[bin]]
name = "linkscope"
path = "src/main.rs"

[dependencies]
linkscope-rate = { path = "../rate" }
linkscope-config = { path = "../config" }
linkscope-web = { path = "../web" }
snmp2 = { version = "0.5", default-features = false, features = ["tokio", "crypto-rust", "heap_buffers"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
bigdecimal = "0.4"
nix = { version = "0.29", features = ["user", "fs", "process", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shell-words = "1"
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1"] }


[dev-dependencies]
tempfile = "3"
