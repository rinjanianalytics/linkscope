[package]
name = "linkscope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "linkscope"
path = "src/lib.rs"

[[bin]]
name = "linkscope"
path = "src/main.rs"

[dependencies]
linkscope-rate = { path = "../rate" }
linkscope-config = { path = "../config" }
linkscope-web = { path = "../web" }
linkscope-gnmi = { path = "../gnmi" }
# SNMP (replaced snmp2 in 2026-10: it changed v3 session state before authenticating a reply).
# Pinned: a pre-1.0 library on the security path is updated deliberately, after reading the change.
async-snmp = { version = "=0.18.1", default-features = false, features = ["crypto-rustcrypto"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
bigdecimal = "0.4"
nix = { version = "0.31", features = ["user", "fs", "process", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shell-words = "1"
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
hmac = "0.13"
# gNMI: gRPC over our own rustls connection (ring, as for mail), so TLS options stay in our hands.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-stream = "0.1"
sha2 = "0.11"


[dev-dependencies]
tempfile = "3"
linkscope-mockagent = { path = "../mockagent" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
