[package]
name = "linkscope-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MRTG configuration reader, validator and safe Target expression compiler"

[dependencies]
bigdecimal = "0.4"
glob = "0.3"
thiserror = "2"
regex = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
regex = "1"
glob = "0.3"
tempfile = "3"
