# srl2: OpenConfig left off, so it answers only the native (srl) model.
# up.sh applies this file, then the generated TLS, user and SNMP settings, then commits.
set / system name host-name srl2
set / system lldp admin-state enable

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to srl1 ethernet-1/2"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.20.2.3/24

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to sink"
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.20.3.2/24

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default next-hop-groups group to-srl1 nexthop 1 ip-address 10.20.2.2
set / network-instance default static-routes route 10.20.1.0/24 next-hop-group to-srl1
