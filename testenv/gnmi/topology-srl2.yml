# SR Linux hardware topology for srl2: a 7220 IXR-D2L, as containerlab's default
# srl type (nodes/srl/topology/7220IXRD2L.yml), with a fixed base MAC per router.
chassis_configuration:
  "chassis_type": 72
  "base_mac": "1a:20:02:00:00:00"
  "cpm_card_type": 187

slot_configuration:
  1:
    "card_type": 187
    "mda_type": 208
